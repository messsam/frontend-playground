<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <title>PROJECT 01</title>
      <style>
         @font-face {
            font-family: "IBM Plex Mono";
            src: url("fonts/IBMPlexMono-Regular.ttf");
            font-weight: 400;
         }
         @font-face {
            font-family: "IBM Plex Mono";
            src: url("fonts/IBMPlexMono-SemiBold.ttf");
            font-weight: 450;
         }
         html {
            scroll-behavior: smooth;
         }
         body {
            color: white;
            background-color: black;
            font-family: "IBM Plex Mono";
         }
         a {
            text-decoration: none;
            color: white;
         }
         .logo {
            position: fixed;
            left: 25px;
            top: 0;
         }
         .nav {
            position: fixed;
            top: 0;
            right: 0;
            display: flex;
            padding: 30px;
            gap: 20px;
         }
         .nav a:hover {
            color: grey;
         }
         .center {
            text-align: center;
         }
         #home {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
         }
      </style>
   </head>
   <body>
      <header>
         <a href="#home" class="logo">
            <h1>PROJECT 01</h1>
         </a>
         <nav class="nav">
            <a href="#home">HOME</a>
            <a href="#about">ABOUT</a>
            <a href="#contact">CONTACT</a>
         </nav>
      </header>
      <section id="home">
         <div class="center">
            <img src="img/gif.gif">
            <p style="margin-top: 5px;">Welcome.</p>
         </div>
      </section>
      <section id="about"></section>
      <section id="contact"></section>
   </body>
</html>
