<!DOCTYPE html>
<html>
   <head>
      <title>Experimental</title>
      <style>
         body {
            color: white;
            background-color: black;
         }
         .container {
            display: flex;            /* Image div */
            justify-content: center;  /* horizontal */
            align-items: center;      /* vertical */
         }
         .navbar {
            position: fixed;
            top: 0;
            right: 0;
            display: flex;            /* makes items horizontal */
            gap: 20px;                /* spacing between links */
            padding: 15px;
         }
         .navbar a {
            text-decoration: none;
            color: white;
         }
         a:hover {
            color: grey;
         }
      </style>
   </head>
   <body>
      <div>
         <h1>Project_01</h1>
         <nav class="navbar">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
         </nav>
      </div>
      <div class="container">
         <img src="img/abstract.jpg"></img>
      </div>
      <div class="container">
         <b>Welcome.</b>
      </div>
   </body>
</html>
