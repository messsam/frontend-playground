<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Arithmetic</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0f0f0f;
        font-family: Arial, sans-serif;
        color: white;
      }

      .container {
        text-align: center;
        background: #1a1a1a;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
      }

      #display {
        font-size: 48px;
        margin-bottom: 20px;
      }

      #input {
        padding: 10px;
        width: 200px;
        border: none;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 16px;
        text-align: center;
      }

      .buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        background-color: #2e2e2e;
        color: white;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background-color: #444;
      }
      button:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p id="display">0</p>
      <input type="number" id="input" placeholder="Enter a number">
      <div class="buttons">
        <button id="increment">Increment</button>
        <button id="decrement">Decrement</button>
        <button id="reset">Reset</button>
      </div>
    </div>
    <script>
      let counter = 0;
      const displayNum = document.getElementById("display");
      const incrementBtn = document.getElementById("increment");
      const decrementBtn = document.getElementById("decrement");
      const resetBtn = document.getElementById("reset");
      const input = document.getElementById("input");

      incrementBtn.addEventListener("click", function() {
          const incrementValue = parseInt(input.value);
          if (!isNaN(incrementValue)) counter += incrementValue;
          displayNum.textContent = counter;
      })
      decrementBtn.addEventListener("click", function() {
          const decrementValue = parseInt(input.value);
          if (!isNaN(decrementValue)) counter -= decrementValue;
          displayNum.textContent = counter;
      })
      resetBtn.addEventListener("click", function() {
          counter = 0;
          displayNum.textContent = counter;
      })
    </script>
  </body>
</html>
