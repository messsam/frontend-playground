<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T 02</title>
</head>
<body>
<p id="display">0</p>
<input type="number" id="input" placeholder="Enter a number">
<button id="increment">Increment</button>
<button id="decrement">Decrement</button>
<button id="reset">Reset</button>
<script>
    let counter = 0;
    const displayNum = document.getElementById("display");
    const incrementBtn = document.getElementById("increment");
    const decrementBtn = document.getElementById("decrement");
    const resetBtn = document.getElementById("reset");
    const input = document.getElementById("input");

    incrementBtn.addEventListener("click", function() {
        const incrementValue = parseInt(input.value);
        if (!isNaN(incrementValue)) counter += incrementValue;
        displayNum.textContent = counter;
    })
    decrementBtn.addEventListener("click", function() {
        const decrementValue = parseInt(input.value);
        if (!isNaN(decrementValue)) counter -= decrementValue;
        displayNum.textContent = counter;
    })
    resetBtn.addEventListener("click", function() {
        counter = 0;
        displayNum.textContent = counter;
    })
</script>
</body>
</html>
